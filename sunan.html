<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنن النبي ﷺ</title>
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/theme-preload.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/page-styles/sunan.css">
</head>

<body>
    <!-- Sidebar Overlay -->
    <!-- Desktop Sidebar -->
        <app-sidebar current="sunan"></app-sidebar>

    <header class="app-header glass-card">
        <button class="menu-toggle-btn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>
        <h1 id="headerTitle">سنن النبي ﷺ</h1>
        <div class="header-left-buttons">
            <div class="visitor-badge">
                <i class="bi bi-people-fill"></i>
                <span class="count" id="visitorCount">-</span>
            </div>
            <button class="header-back-btn" id="backBtn" onclick="showCategories()" style="display: none;">
                <i class="bi bi-arrow-right"></i>
            </button>
            <button class="settings-btn" onclick="window.location.href='settings.html'">
                <i class="bi bi-gear-fill"></i>
            </button>
        </div>
    </header>

    <main class="app-content">
        <div class="sunan-container">
            <!-- Categories Grid -->
            <div class="category-grid" id="categoryGrid">
                <div class="category-card" onclick="showSunan('waking_up')">
                    <div class="category-icon"><i class="bi bi-sun"></i></div>
                    <div class="category-title">سنن الاستيقاظ</div>
                </div>
                <div class="category-card" onclick="showSunan('ablution')">
                    <div class="category-icon"><i class="bi bi-droplet"></i></div>
                    <div class="category-title">سنن الوضوء</div>
                </div>
                <div class="category-card" onclick="showSunan('prayer')">
                    <div class="category-icon"><i class="bi bi-person"></i></div>
                    <div class="category-title">سنن الصلاة</div>
                </div>
                <div class="category-card" onclick="showSunan('eating')">
                    <div class="category-icon"><i class="bi bi-cup-hot"></i></div>
                    <div class="category-title">سنن الطعام</div>
                </div>
                <div class="category-card" onclick="showSunan('sleeping')">
                    <div class="category-icon"><i class="bi bi-moon-stars"></i></div>
                    <div class="category-title">سنن النوم</div>
                </div>
                <div class="category-card" onclick="showSunan('general')">
                    <div class="category-icon"><i class="bi bi-stars"></i></div>
                    <div class="category-title">سنن عامة</div>
                </div>
            </div>

            <!-- Sunan List -->
            <div class="sunan-list" id="sunanList"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
        <app-bottom-nav current="sunan"></app-bottom-nav>

    <script src="js/common.js"></script>
        <script src="js/page-scripts/sunan.js"></script>
</body>

</html>
