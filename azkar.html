<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأذكار</title>
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/theme-preload.js"></script>
        <script src="js/native-bridge.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/page-styles/azkar.css">
</head>

<body>
    <!-- App Header -->
        <app-sidebar current="azkar"></app-sidebar>

    <header class="app-header glass-card">
        <button class="menu-toggle-btn" id="backBtn" onclick="showCategories()" style="display: none;">
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="icon-btn menu-toggle-btn" id="menuBtn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>
        <h1 id="headerTitle">الأذكار</h1>
        <div class="header-left-buttons">
            <button class="menu-toggle-btn view-mode-btn" id="viewModeBtn" onclick="toggleViewMode()" style="display: none;" title="تبديل طريقة العرض">
                <i class="bi bi-view-stacked"></i>
                <span class="view-mode-label">بطاقات</span>
            </button>
            <div class="visitor-badge">
                <i class="bi bi-people-fill"></i>
                <span class="count" id="visitorCount">-</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
        <!-- Category List -->
        <div class="category-list" id="categoryList"></div>

        <!-- Azkar List -->
        <div class="azkar-list" id="azkarList"></div>
    </main>

    <!-- Bottom Navigation -->
        <app-bottom-nav current="azkar"></app-bottom-nav>

    <script src="js/common.js"></script>
        <script src="js/page-scripts/azkar.js"></script>
</body>
</html>
