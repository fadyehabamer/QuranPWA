<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواضع المحفوظة</title>
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/theme-preload.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/common.js"></script>
    <link rel="stylesheet" href="css/page-styles/bookmarks.css">
</head>

<body>
    <app-sidebar current="bookmarks"></app-sidebar>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title" id="modalTitle">عنوان</div>
            </div>
            <div class="modal-message" id="modalMessage">رسالة</div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="app-header glass-card">
        <h1>المواضع المحفوظة</h1>
        <div class="header-left-buttons">
            <div class="visitor-badge">
                <i class="bi bi-people-fill"></i>
                <span class="count" id="visitorCount">-</span>
            </div>
            <button class="header-back-btn" onclick="window.location.href='/'">→</button>
            <button class="settings-btn" onclick="window.location.href='settings.html'"><i
                    class="bi bi-gear-fill"></i></button>
            <button class="menu-toggle-btn" onclick="toggleSidebar()">☰</button>
        </div>
    </div>

    <div class="app-content">
        <div class="bookmarks-container">
            <div class="bookmarks-header">
                <div class="bookmarks-header-icon"></div>
                <h2 class="bookmarks-header-title">مواضع القراءة المحفوظة</h2>
                <p class="bookmarks-header-desc">احفظ مكان قراءتك وارجع إليه في أي وقت</p>
            </div>

            <div class="bookmarks-stats" id="bookmarksStats" style="display: none;">
                <div class="stat-item">
                    <div class="stat-value" id="totalBookmarks">0</div>
                    <div class="stat-label">موضع محفوظ</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalSurahs">0</div>
                    <div class="stat-label">سورة</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalFolders">0</div>
                    <div class="stat-label">مجلد</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="recentVisits">0</div>
                    <div class="stat-label">زيارة حديثة</div>
                </div>
            </div>

            <div class="bookmarks-controls glass-card" id="bookmarksControls" style="display: none;">
                <div class="bookmarks-controls-head">
                    <div class="bookmarks-controls-title">البحث والفلاتر</div>
                    <button id="bookmarksControlsToggleBtn" class="bookmarks-controls-toggle" type="button" onclick="toggleFiltersPanelVisibility()" aria-pressed="true">
                        <i class="bi bi-toggle-on" aria-hidden="true"></i>
                        <span>إخفاء</span>
                    </button>
                </div>

                <div id="bookmarksControlsBody" class="bookmarks-controls-body">
                    <div class="controls-grid">
                        <div class="control-field">
                            <label class="control-label" for="bookmarkSearchInput">بحث</label>
                            <input id="bookmarkSearchInput" class="control-input" type="search" placeholder="ابحث باسم السورة أو الملاحظة أو الوسوم" oninput="handleFiltersChange()">
                        </div>
                        <div class="control-field">
                            <label class="control-label" for="bookmarkSortSelect">ترتيب</label>
                            <select id="bookmarkSortSelect" class="control-select" onchange="handleFiltersChange()">
                                <option value="recent">الأحدث أولاً</option>
                                <option value="oldest">الأقدم أولاً</option>
                                <option value="surah">حسب السورة</option>
                                <option value="visited">الأكثر زيارة</option>
                            </select>
                        </div>
                        <div class="control-field">
                            <label class="control-label" for="folderFilter">المجلد</label>
                            <select id="folderFilter" class="control-select" onchange="handleFiltersChange()"></select>
                        </div>
                        <div class="control-field">
                            <label class="control-label" for="tagFilter">الوسوم</label>
                            <select id="tagFilter" class="control-select" onchange="handleFiltersChange()"></select>
                        </div>
                    </div>
                    <div class="control-actions">
                        <input id="newFolderInput" class="control-input" type="text" placeholder="اسم مجلد جديد (مثال: حفظ ومراجعة)">
                        <button class="folder-add-btn" type="button" onclick="createFolderFromInput()">إضافة مجلد</button>
                        <button class="filters-clear-btn" type="button" onclick="clearBookmarkFilters()">مسح الفلاتر</button>
                    </div>
                    <div class="filters-result-meta" id="filtersResultMeta">0 نتيجة</div>
                </div>
            </div>

            <div class="folders-overview" id="foldersOverview" style="display:none;">
                <div class="folders-overview-head">
                    <div class="folders-overview-title">المجلدات</div>
                    <button id="foldersOverviewToggleBtn" class="folders-overview-toggle" type="button" onclick="toggleFoldersOverviewVisibility()" aria-pressed="true">
                        <i class="bi bi-toggle-on" aria-hidden="true"></i>
                        <span>إخفاء</span>
                    </button>
                </div>
                <div class="folders-overview-list" id="foldersOverviewList"></div>
            </div>

            <div class="recent-bookmarks" id="recentBookmarksSection" style="display:none;">
                <div class="recent-title">آخر الزيارات</div>
                <div class="recent-list" id="recentBookmarksList"></div>
            </div>

            <div id="bookmarksContent"></div>
        </div>
    </div>

        <app-bottom-nav current="bookmarks"></app-bottom-nav>

        <script src="js/page-scripts/bookmarks.js"></script>
</body>

</html>
