<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>مواقيت الصلاة</title>
    <meta name="description" content="مواقيت الصلاة حسب موقعك مع الوقت المتبقي للصلاة القادمة وبوصلة اتجاه القبلة.">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="القرآن الكريم">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/theme-preload.js"></script>
    <script src="js/a11y.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/page-styles/prayer-times.css">
    <link rel="stylesheet" href="css/app-ui.css">
    <link rel="stylesheet" href="css/native.css">
</head>

<body>
    <!-- App Header -->
    <app-sidebar current="prayer"></app-sidebar>

    <app-header title="مواقيت الصلاة"></app-header>

    <!-- Main Content -->
    <main class="app-content">
        <div class="prayer-times-container">
            <!-- Location Section -->
            <div class="location-section" id="locationSection">
                <div class="location-text">
                    <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
                    اختر طريقة تحديد الموقع
                </div>
                <div class="location-buttons" id="locationButtons">
                    <button class="location-btn" onclick="selectAutomaticLocation()">
                        <i class="bi bi-crosshair" aria-hidden="true"></i>
                        تلقائي
                    </button>
                    <button class="location-btn secondary" onclick="selectManualLocation()">
                        <i class="bi bi-geo-alt" aria-hidden="true"></i>
                        يدوي
                    </button>
                </div>
                <div class="location-selected" id="locationSelected" style="display: none;">
                    <div class="location-info">
                        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
                        <span id="locationText">تم تحديد الموقع</span>
                    </div>
                    <button class="reset-location-btn" onclick="resetLocation()">
                        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                        تغيير
                    </button>
                </div>
            </div>

            <!-- Next Prayer Highlight -->
            <div class="next-prayer-highlight" id="nextPrayerSection" style="display: none;">
                <h2 class="next-prayer-title">الصلاة القادمة</h2>
                <div class="next-prayer-time" id="nextPrayerName"></div>
                <div class="next-prayer-remaining" id="nextPrayerRemaining"></div>
                <div class="tahajjud-info" id="tahajjudInfo">
                    <div class="tahajjud-label">قيام الليل</div>
                    <div class="tahajjud-time" id="tahajjudTime"></div>
                </div>
            </div>

            <!-- Prayer Times Grid -->
            <div class="prayer-grid" id="prayerGrid">
                <!-- Prayer times will be loaded here after location selection -->
            </div>

            <!-- Qibla Compass -->
            <div class="qibla-section" id="qiblaSection" style="display: none;">
                <h2 class="qibla-title"><i class="bi bi-compass" aria-hidden="true"></i> اتجاه القبلة</h2>
                <div class="qibla-subtitle">يُرجى توجيه الهاتف أفقيًا لتحسين دقة البوصلة</div>
                <!-- The compass is a purely visual instrument; the accessible
                     equivalent is #qiblaMeta plus the throttled live readout
                     below, so the dial itself is hidden from assistive tech. -->
                <div class="qibla-compass-wrap" aria-hidden="true">
                    <div class="qibla-compass" id="qiblaCompass">
                        <div class="qibla-north">N</div>
                        <!-- ☪ is kept as a meaningful cultural marker for the
                             qibla, but the "اتجاه القبلة" heading above already
                             names it, so it is not announced twice. -->
                        <div class="qibla-marker">☪</div>
                        <div class="qibla-needle" id="qiblaNeedle"></div>
                        <div class="qibla-center-dot"></div>
                    </div>
                </div>
                <div class="qibla-meta" id="qiblaMeta">جاري حساب اتجاه القبلة...</div>
                <!-- Throttled screen-reader readout of the live bearing. The
                     visible #qiblaMeta repaints up to ~12x/second, which would
                     be unusable as a live region, so announcements are rate
                     limited in updateQiblaLiveReadout(). -->
                <p class="sr-only" id="qiblaLiveReadout" aria-live="polite" aria-atomic="true"></p>
                <div class="qibla-calibration" id="qiblaCalibrationHint">
                    <div class="qibla-eight-track" aria-hidden="true">
                        <div class="qibla-phone-dot"></div>
                    </div>
                    <div class="qibla-calibration-content">
                        <p class="qibla-calibration-text">حرّك الهاتف بحركة شكل 8 لمدة ثانيتين لمعايرة البوصلة</p>
                        <div class="qibla-calibration-actions">
                            <span class="qibla-calibration-countdown" id="qiblaCalibrationCountdown">02:00</span>
                        </div>
                    </div>
                </div>
                <div class="qibla-calibration-controls">
                    <button type="button" class="qibla-calibration-btn qibla-recalibrate-btn" id="qiblaCalibrationBtn"
                        onclick="startQiblaCalibrationGuide()">إعادة المعايرة</button>
                    <button type="button" class="location-btn secondary qibla-toggle-btn" id="qiblaCalibrationToggleBtn"
                        onclick="toggleQiblaCalibrationHint()">
                        <i class="bi bi-sliders" aria-hidden="true"></i> اعادة المعايرة
                    </button>
                </div>
                <button class="location-btn secondary qibla-permission-btn" id="qiblaPermissionBtn"
                    onclick="requestQiblaPermission()" style="display: none;">
                    <i class="bi bi-phone" aria-hidden="true"></i>
                    تفعيل مستشعر البوصلة
                </button>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage" role="alert" style="display: none;">
                <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"
                    style="font-size: 24px; margin-bottom: 10px;"></i>
                <div>حدث خطأ في تحميل مواقيت الصلاة</div>
                <button class="retry-btn" onclick="loadPrayerTimes()">إعادة المحاولة</button>
            </div>
        </div>
    </main>

    <!-- Country Selection Modal -->
    <div class="modal-overlay" id="countryModal" role="dialog" aria-labelledby="countryModalTitle"
        onclick="closeCountryModal()">
        <div class="country-modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="countryModalTitle">اختر الدولة</h2>
                <button class="modal-close-btn" onclick="closeCountryModal()" aria-label="إغلاق">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
            <div class="country-search-wrap">
                <input type="search" id="countrySearchInput" class="country-search" placeholder="ابحث عن الدولة..."
                    aria-label="بحث عن الدولة" oninput="filterCountryList()">
            </div>
            <div class="country-list" id="countryList">
                <!-- Countries will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <app-bottom-nav current="prayer"></app-bottom-nav>

    <script src="js/prayer-core.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-scripts/prayer-times.js"></script>
    <script src="js/native-ui.js"></script>
</body>

</html>
