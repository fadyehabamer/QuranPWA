<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسبحة الإلكترونية</title>
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/theme-preload.js"></script>
        <script src="js/native-bridge.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/page-styles/masbaha.css">
</head>

<body>
    <!-- Sidebar Overlay -->
    <!-- Desktop Sidebar -->
        <app-sidebar current="masbaha"></app-sidebar>

    <header class="app-header glass-card">
        <button class="menu-toggle-btn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>
        <h1>المسبحة الإلكترونية</h1>
        <div class="header-left-buttons">
            <div class="visitor-badge">
                <i class="bi bi-people-fill"></i>
                <span class="count" id="visitorCount">-</span>
            </div>
            <button class="settings-btn" onclick="window.location.href='settings.html'">
                <i class="bi bi-gear-fill"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
        <div class="masbaha-container">
            <div class="masbaha-main-panel">
            <div class="lifetime-counter" id="lifetimeCounter">
                <i class="bi bi-trophy-fill"></i>
                <span>مجموع التسبيحات: 0</span>
            </div>

            <div class="dhikr-selector-container">
                <div class="dhikr-chips">
                    <div class="dhikr-chip" data-dhikr="subhan_allah" onclick="selectDhikr('subhan_allah', this)">سبحان الله (33)</div>
                    <div class="dhikr-chip" data-dhikr="alhamdulillah" onclick="selectDhikr('alhamdulillah', this)">الحمد لله (33)</div>
                    <div class="dhikr-chip" data-dhikr="allahu_akbar" onclick="selectDhikr('allahu_akbar', this)">الله أكبر (33)</div>
                    <div class="dhikr-chip" data-dhikr="la_ilaha_illa_allah" onclick="selectDhikr('la_ilaha_illa_allah', this)">لا إله إلا الله (100)
                    </div>
                    <div class="dhikr-chip" data-dhikr="astaghfirullah" onclick="selectDhikr('astaghfirullah', this)">أستغفر الله (100)</div>
                    <div class="dhikr-chip" data-dhikr="salat_nabi" onclick="selectDhikr('salat_nabi', this)">صلى على النبي (10)</div>
                    <div class="dhikr-chip active" data-dhikr="custom" onclick="selectDhikr('custom', this)">مخصص</div>
                </div>
            </div>

            <div class="counter-display">
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="85"></circle>
                    <circle class="progress-ring-circle" id="progressCircle" cx="100" cy="100" r="85"></circle>
                </svg>
                <div class="counter-value" id="counterValue">0</div>
            </div>
            <div class="target-display" id="targetDisplay">الهدف: غير محدد</div>
            <div class="session-insights">
                <div class="insight-chip" id="selectedDhikrLabel">الذكر: مخصص</div>
                <div class="insight-chip" id="remainingLabel">المتبقي: --</div>
                <div class="insight-chip" id="todayCountLabel">تسبيحات اليوم: 0</div>
            </div>
            <div class="motivation-text" id="motivationText">ابدأ الآن واذكر الله</div>

            <button class="tap-button" id="tapButton" onclick="increment()">
                <i class="bi bi-hand-index-fill"></i>
            </button>

            <div class="preset-buttons">
                <button class="preset-btn" onclick="setTarget(33)">33</button>
                <button class="preset-btn" onclick="setTarget(99)">99</button>
                <button class="preset-btn" onclick="setTarget(100)">100</button>
                <button class="preset-btn" onclick="setTarget(500)">500</button>
                <button class="preset-btn" onclick="setTarget(1000)">1000</button>
            </div>

            <div class="custom-target">
                <input type="number" id="customTargetInput" placeholder="هدف مخصص" min="1">
                <button onclick="setCustomTarget()" 
                    style="font-family: 'cairo';"
                >حفظ</button>
            </div>

            <div class="controls">
                <button class="control-btn control-btn-soft" id="undoBtn" onclick="undoLastIncrement()" disabled>
                    <i class="bi bi-arrow-counterclockwise"></i> تراجع
                </button>
                <button class="control-btn control-btn-soft" onclick="addBulk(10)">
                    <i class="bi bi-plus-circle"></i> +10
                </button>
                <button class="control-btn control-btn-soft" id="autoToggleBtn" onclick="toggleAutoCount()">
                    <i class="bi bi-cpu"></i> تلقائي
                </button>
                <button class="control-btn" onclick="reset()">
                    <i class="bi bi-arrow-clockwise"></i> إعادة تعيين
                </button>
                <button class="control-btn" onclick="saveCount()">
                    <i class="bi bi-bookmark-fill"></i> حفظ في السجل
                </button>
                <div style="position: relative;">
                    <button class="sound-toggle" id="soundToggle" onclick="toggleSoundMenu()">
                        <span id="soundIcon">🔊</span> الصوت
                    </button>
                    <div class="sound-selector" id="soundSelector">
                        <select class="sound-select" onchange="changeSound(this.value)">
                            <option value="beep">صفير</option>
                            <option value="click">نقرة</option>
                            <option value="water">ماء</option>
                        </select>
                    </div>
                </div>
                <button class="sound-toggle" id="vibrationToggle" onclick="toggleVibration()">
                    <i class="bi bi-phone-vibrate"></i> الاهتزاز
                </button>
            </div>
            </div>

            <button class="quick-tap-fab" id="quickTapFab" onclick="increment()" aria-label="تسبيح سريع">
                <i class="bi bi-plus-lg"></i>
                <span>تسبيح</span>
            </button>

            <div class="history">
                <div class="history-title">
                    سجل التسبيح
                    <button class="clear-all-btn" id="clearHistoryBtn" onclick="clearHistory()"
                        style="display: none;">مسح الكل</button>
                </div>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
        <app-bottom-nav current="masbaha"></app-bottom-nav>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title" id="modalTitle"></div>
            </div>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script src="js/common.js"></script>
        <script src="js/page-scripts/masbaha.js"></script>
</body>

</html>
