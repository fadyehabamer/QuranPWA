<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>القرآن الكريم - الصفحة الرئيسية</title>
    <meta name="description" content="تطبيق القرآن الكريم الشامل: قراءة وتلاوة، أذكار، مسبحة، مواقيت الصلاة، ومتابعة الختمة.">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="القرآن الكريم">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Lateef&family=Reem+Kufi:wght@400;600&display=swap"
        rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous">
    <script src="js/theme-preload.js"></script>
    <script src="js/a11y.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/page-styles/index.css">
    <link rel="stylesheet" href="css/app-ui.css">
    <link rel="stylesheet" href="css/tour.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/native.css">
    <link rel="stylesheet" href="css/nav.css">
    <!-- Authoritative layer for the home screen. Loaded last so its native
         mobile layout (prayer hero, quick grid, inspiration, mood) wins over
         the legacy home rules still living in index.css. -->
    <link rel="stylesheet" href="css/page-styles/home.css">
</head>

<body>
    <!-- Sidebar Overlay -->
    <!-- Desktop Sidebar -->
    <app-sidebar current="home"></app-sidebar>

    <app-header title="القرآن الكريم" home></app-header>

    <!-- Main Content -->
    <main class="app-content">
        <div class="home-container">
            <!-- ============================================================
                 1. Prayer hero — dynamic time-of-day sky. common.js keys off
                    #homePrayerWidget to populate it; it sets data-phase, the
                    next-prayer focus, the timeline fill and the five chips.
                 ============================================================ -->
            <section class="prayer-hero animate-fade-up" id="homePrayerWidget" data-phase="night"
                aria-label="مواقيت الصلاة">
                <div class="prayer-hero-top">
                    <div class="ph-place">
                        <div class="ph-location">
                            <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
                            <span id="pwLocation">جاري تحديد الموقع…</span>
                        </div>
                        <div class="ph-hijri" id="phHijri"></div>
                    </div>
                    <div class="ph-actions">
                        <a class="ph-icon-btn" href="/prayer-times" aria-label="كل المواقيت والتفاصيل">
                            <i class="bi bi-clock-history" aria-hidden="true"></i>
                        </a>
                        <a class="ph-icon-btn" href="/settings" aria-label="الإعدادات">
                            <i class="bi bi-sliders" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>

                <div class="prayer-hero-main">
                    <div class="ph-now">
                        <span class="ph-next-label">الصلاة القادمة</span>
                        <span class="ph-next-name" id="phNextName">—</span>
                        <span class="ph-next-time" id="phNextTime">--:--</span>
                        <span class="ph-edges" id="phEdges"></span>
                    </div>

                    <!-- Countdown ring: sweeps through the current prayer window. -->
                    <div class="ph-ring" role="timer" aria-live="off">
                        <svg class="ph-ring-svg" viewBox="0 0 120 120" aria-hidden="true">
                            <circle class="ph-ring-track" cx="60" cy="60" r="52"></circle>
                            <circle class="ph-ring-fill" id="phRingFill" cx="60" cy="60" r="52"></circle>
                        </svg>
                        <span class="ph-ring-label">
                            <span class="ph-ring-cap">متبقٍّ</span>
                            <span class="ph-ring-time" id="phCountdown">--:--</span>
                        </span>
                    </div>
                </div>

                <div class="prayer-hero-row" id="pwBody">
                    <!-- Five prayer chips rendered by common.js -->
                </div>

                <!-- Self-contained mosque silhouette, no asset fetch. -->
                <svg class="ph-mosque" viewBox="0 0 320 80" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                    <path d="M38 80V34a6 6 0 0 1 12 0v46z" />
                    <circle cx="44" cy="28" r="6" />
                    <path d="M270 80V34a6 6 0 0 1 12 0v46z" />
                    <circle cx="276" cy="28" r="6" />
                    <path d="M76 80V62a22 20 0 0 1 44 0v18z" />
                    <path d="M200 80V62a22 20 0 0 1 44 0v18z" />
                    <path d="M124 80V50a36 32 0 0 1 72 0v30z" />
                    <path d="M158 20h4v10h-4z" />
                    <circle cx="160" cy="16" r="4" />
                </svg>
            </section>

            <!-- ============================================================
                 2. Quick actions — continue reading + Khatma progress
                 ============================================================ -->
            <div class="home-quick-grid animate-fade-up delay-1">
                <button type="button" class="quick-card" id="homeContinueCard"
                    onclick="resumeReadingOrStart()">
                    <div class="quick-card-head">
                        <span class="quick-card-icon"><i class="bi bi-book-half" aria-hidden="true"></i></span>
                        <span class="quick-card-label">متابعة القراءة</span>
                    </div>
                    <div class="quick-card-body">
                        <div class="quick-card-value" id="homeContinueValue">ابدأ من سورة الفاتحة</div>
                        <span class="quick-card-cta">واصل الآن <i class="bi bi-arrow-left-short" aria-hidden="true"></i></span>
                    </div>
                </button>

                <a href="/khatma" class="quick-card gold" id="homeKhatmaCard">
                    <div class="quick-card-head">
                        <span class="quick-card-icon"><i class="bi bi-journal-check" aria-hidden="true"></i></span>
                        <span class="quick-card-label">مركز الختمة</span>
                    </div>
                    <div class="quick-progress">
                        <div class="quick-progress-track">
                            <span class="quick-progress-fill" id="homeKhatmaFill"></span>
                        </div>
                        <div class="quick-progress-meta">
                            <span id="homeKhatmaMeta">خطة الختمة اليومية</span>
                            <span class="quick-progress-percent" id="homeKhatmaPercent">0%</span>
                        </div>
                    </div>
                </a>
            </div>

            <!-- ============================================================
                 2b. Prayer tracker — mark each prayer as prayed
                 ============================================================ -->
            <section class="prayer-tracker animate-fade-up delay-1" aria-label="متابعة الصلوات">
                <div class="tracker-head">
                    <div class="tracker-title"><i class="bi bi-check2-square" aria-hidden="true"></i> متابعة الصلوات</div>
                    <div class="tracker-meta" id="trackerMeta">0 / 5</div>
                </div>
                <div class="tracker-row" id="trackerRow" role="group" aria-label="الصلوات اليوم"></div>
                <div class="tracker-streak" id="trackerStreak"></div>
            </section>

            <!-- ============================================================
                 3. Daily inspiration — verse of the day + hadith
                 ============================================================ -->
            <section class="inspiration-card animate-fade-up delay-2" aria-label="آية اليوم">
                <div class="inspiration-label"><i class="bi bi-stars" aria-hidden="true"></i> آية اليوم</div>
                <p class="verse-arabic" id="dailyVerseText">جارٍ التحميل…</p>
                <div class="verse-ref" id="dailyVerseInfo"></div>
                <div class="inspiration-actions">
                    <button type="button" class="inspiration-btn" id="verseSaveBtn" onclick="saveDailyVerse(this)">
                        <i class="bi bi-bookmark" aria-hidden="true"></i> حفظ
                    </button>
                    <button type="button" class="inspiration-btn" id="verseListenBtn" onclick="listenDailyVerse(this)">
                        <i class="bi bi-volume-up" aria-hidden="true"></i> استماع
                    </button>
                    <button type="button" class="inspiration-btn" onclick="shareDailyVerse()">
                        <i class="bi bi-share" aria-hidden="true"></i> مشاركة
                    </button>
                </div>
            </section>

            <section class="inspiration-card gold animate-fade-up delay-2" aria-label="حديث اليوم">
                <div class="inspiration-label"><i class="bi bi-chat-quote-fill" aria-hidden="true"></i> حديث اليوم</div>
                <p class="hadith-text" id="dailyHadith">جارٍ التحميل…</p>
            </section>

            <!-- ============================================================
                 4. Quranic emotional support — mood pills + prompt
                 ============================================================ -->
            <section class="mood-widget animate-fade-up delay-3" aria-label="دعم نفسي بالقرآن">
                <div class="mood-widget-title"><i class="bi bi-heart-pulse" aria-hidden="true"></i> كيف تشعر اليوم؟</div>
                <p class="mood-widget-subtitle">اختر شعورك أو اكتبه بكلماتك، لنقترح لك آيات تبعث الطمأنينة.</p>

                <div class="mood-pills" role="group" aria-label="اختيار الشعور">
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أنا حزين', this)"><i class="bi bi-cloud-drizzle" aria-hidden="true"></i> حزين</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أشعر بالقلق', this)"><i class="bi bi-activity" aria-hidden="true"></i> قلق</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أشعر بضغط شديد', this)"><i class="bi bi-lightning-charge" aria-hidden="true"></i> توتر</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أنا غاضب', this)"><i class="bi bi-fire" aria-hidden="true"></i> غضب</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أشعر بالذنب', this)"><i class="bi bi-arrow-repeat" aria-hidden="true"></i> ذنب</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أعيش حالة فقد وحزن', this)"><i class="bi bi-heartbreak" aria-hidden="true"></i> فقد</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أنا منهك ومطفي', this)"><i class="bi bi-battery-half" aria-hidden="true"></i> احتراق</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أشعر بالوحدة', this)"><i class="bi bi-person" aria-hidden="true"></i> وحدة</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أحتاج أمل', this)"><i class="bi bi-brightness-high" aria-hidden="true"></i> أمل</button>
                    <button type="button" class="mood-chip" onclick="applyMoodQuick('أحتاج شكر وامتنان', this)"><i class="bi bi-stars" aria-hidden="true"></i> امتنان</button>
                </div>

                <div class="mood-prompt">
                    <label class="sr-only" for="moodInput">اكتب شعورك</label>
                    <textarea id="moodInput" class="mood-input"
                        placeholder="اكتب شعورك بكلماتك…"></textarea>
                </div>

                <button id="moodGenerateBtn" type="button" class="mood-generate-btn"
                    onclick="generateMoodSupport()"><i class="bi bi-stars" aria-hidden="true"></i> ولّد آيات مناسبة</button>
                <div id="moodStatus" class="mood-status" aria-live="polite"></div>
                <div id="moodResult" class="mood-result" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <app-bottom-nav current="home"></app-bottom-nav>

    <script src="js/data/surahs.js"></script>
    <script src="js/prayer-core.js"></script>
    <script src="js/notify-store.js"></script>
    <script src="js/common.js"></script>
    <script src="js/page-scripts/index.js"></script>
    <script src="js/native-ui.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/tour.js"></script>
    <script src="js/tours.js"></script>
    <script src="js/notifications.js"></script>
</body>

</html>
