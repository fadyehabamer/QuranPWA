    <style>
        .bio-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }

        .bio-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 12px var(--shadow);
            text-align: center;
        }

        .bio-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .bio-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bio-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .bio-title {
            font-size: 18px;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .bio-description {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-color);
            margin-bottom: 32px;
            text-align: justify;
            display: none;
        }

        .bio-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .bio-btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .bio-btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .bio-btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .bio-btn-secondary {
            background: var(--card-bg);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .bio-btn-secondary:hover {
            background: var(--primary-color);
            color: white;
        }

        .bio-social {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.3s;
            color: var(--text-color);
        }

        .social-link:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .bio-contact {
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 16px 0;
            font-size: 16px;
            color: var(--text-color);
            direction: ltr;
        }

        .contact-icon {
            font-size: 24px;
        }

        .contact-link {
            color: var(--primary-color);
            text-decoration: none;
        }

        .contact-link:hover {
            text-decoration: underline;
        }

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // Load theme settings
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 27, g: 94, b: 32 };
        }

        function loadThemeSettings() {
            const darkMode = localStorage.getItem('darkMode') === 'true';
            if (darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            const color = localStorage.getItem('primaryColor');
            if (color) {
                const lightColor = adjustColor(color, 30);
                document.documentElement.style.setProperty('--primary-color', color);
                document.documentElement.style.setProperty('--primary-light', lightColor);

                // Update shadow colors
                const rgb = hexToRgb(color);
                const shadowLight = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${darkMode ? 0.25 : 0.15})`;
                const shadowHeavy = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${darkMode ? 0.45 : 0.35})`;
                document.documentElement.style.setProperty('--shadow', shadowLight);
                document.documentElement.style.setProperty('--shadow-heavy', shadowHeavy);
            }

            const fontSize = localStorage.getItem('fontSize');
            if (fontSize !== null) {
                const fontSizes = [12, 14, 16, 18, 20, 24, 28];
                const baseSize = fontSizes[parseInt(fontSize)] || 16;
                document.documentElement.style.setProperty('--font-size-base', baseSize + 'px');
            }

            const fontWeight = localStorage.getItem('fontWeight');
            if (fontWeight) {
                const fontWeights = [300, 400, 500, 600, 700];
                const weight = fontWeights[parseInt(fontWeight)];
                document.documentElement.style.setProperty('--font-weight', weight);
            }
        }

        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * amount);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255))
                .toString(16).slice(1);
        }

        loadThemeSettings();

                .catch(err => console.log('SW registration failed'));
        }
