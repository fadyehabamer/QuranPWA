<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>المسبحة الإلكترونية</title>
    <meta name="description" content="مسبحة إلكترونية بعدّاد قابل للتخصيص وحفظ السجل.">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="القرآن الكريم">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/theme-preload.js"></script>
    <script src="js/a11y.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/page-styles/masbaha.css">
    <link rel="stylesheet" href="css/app-ui.css">
    <link rel="stylesheet" href="css/native.css">
</head>

<body>
    <!-- Sidebar Overlay -->
    <!-- Desktop Sidebar -->
        <app-sidebar current="masbaha"></app-sidebar>

    <app-header title="المسبحة الإلكترونية"></app-header>

    <!-- Main Content -->
    <main class="app-content">
        <div class="masbaha-container">
            <div class="masbaha-main-panel">
            <div class="lifetime-counter" id="lifetimeCounter">
                <i class="bi bi-trophy-fill" aria-hidden="true"></i>
                <span>مجموع التسبيحات: 0</span>
            </div>

            <div class="dhikr-selector-container">
                <div class="dhikr-chips" role="group" aria-label="اختيار الذكر">
                    <button type="button" class="dhikr-chip" data-dhikr="subhan_allah" aria-pressed="false" onclick="selectDhikr('subhan_allah', this)">سبحان الله (33)</button>
                    <button type="button" class="dhikr-chip" data-dhikr="alhamdulillah" aria-pressed="false" onclick="selectDhikr('alhamdulillah', this)">الحمد لله (33)</button>
                    <button type="button" class="dhikr-chip" data-dhikr="allahu_akbar" aria-pressed="false" onclick="selectDhikr('allahu_akbar', this)">الله أكبر (33)</button>
                    <button type="button" class="dhikr-chip" data-dhikr="la_ilaha_illa_allah" aria-pressed="false" onclick="selectDhikr('la_ilaha_illa_allah', this)">لا إله إلا الله (100)</button>
                    <button type="button" class="dhikr-chip" data-dhikr="astaghfirullah" aria-pressed="false" onclick="selectDhikr('astaghfirullah', this)">أستغفر الله (100)</button>
                    <button type="button" class="dhikr-chip" data-dhikr="salat_nabi" aria-pressed="false" onclick="selectDhikr('salat_nabi', this)">صلى على النبي (10)</button>
                    <button type="button" class="dhikr-chip active" data-dhikr="custom" aria-pressed="true" onclick="selectDhikr('custom', this)">مخصص</button>
                </div>
            </div>

            <!-- The ring only re-draws the number, so it is decorative; the
                 count itself is announced from the live region. -->
            <div class="counter-display" role="status" aria-live="polite" aria-atomic="true">
                <svg class="progress-ring" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="85"></circle>
                    <circle class="progress-ring-circle" id="progressCircle" cx="100" cy="100" r="85"></circle>
                </svg>
                <span class="sr-only">عدد التسبيحات:</span>
                <div class="counter-value" id="counterValue">0</div>
            </div>
            <div class="target-display" id="targetDisplay">الهدف: غير محدد</div>
            <div class="session-insights">
                <div class="insight-chip" id="selectedDhikrLabel">الذكر: مخصص</div>
                <div class="insight-chip" id="remainingLabel">المتبقي: --</div>
                <div class="insight-chip" id="todayCountLabel">تسبيحات اليوم: 0</div>
            </div>
            <div class="motivation-text" id="motivationText">ابدأ الآن واذكر الله</div>

            <button type="button" class="tap-button" id="tapButton" aria-label="تسبيح" onclick="increment()">
                <i class="bi bi-hand-index-fill" aria-hidden="true"></i>
            </button>

            <div class="preset-buttons" role="group" aria-label="أهداف جاهزة">
                <button type="button" class="preset-btn" aria-label="الهدف 33" onclick="setTarget(33)">33</button>
                <button type="button" class="preset-btn" aria-label="الهدف 99" onclick="setTarget(99)">99</button>
                <button type="button" class="preset-btn" aria-label="الهدف 100" onclick="setTarget(100)">100</button>
                <button type="button" class="preset-btn" aria-label="الهدف 500" onclick="setTarget(500)">500</button>
                <button type="button" class="preset-btn" aria-label="الهدف 1000" onclick="setTarget(1000)">1000</button>
            </div>

            <div class="custom-target">
                <label class="sr-only" for="customTargetInput">هدف مخصص</label>
                <input type="number" id="customTargetInput" placeholder="هدف مخصص" min="1">
                <button type="button" onclick="setCustomTarget()">حفظ</button>
            </div>

            <div class="controls">
                <button type="button" class="control-btn control-btn-soft" id="undoBtn" onclick="undoLastIncrement()" disabled>
                    <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> تراجع
                </button>
                <button type="button" class="control-btn control-btn-soft" onclick="addBulk(10)">
                    <i class="bi bi-plus-circle" aria-hidden="true"></i> +10
                </button>
                <button type="button" class="control-btn control-btn-soft" id="autoToggleBtn" aria-pressed="false" onclick="toggleAutoCount()">
                    <i class="bi bi-cpu" aria-hidden="true"></i> تلقائي
                </button>
                <button type="button" class="control-btn" onclick="reset()">
                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> إعادة تعيين
                </button>
                <button type="button" class="control-btn" onclick="saveCount()">
                    <i class="bi bi-bookmark-fill" aria-hidden="true"></i> حفظ في السجل
                </button>
                <div class="sound-control">
                    <button type="button" class="sound-toggle" id="soundToggle"
                        aria-expanded="false" aria-controls="soundSelector" onclick="toggleSoundMenu()">
                        <i class="bi bi-volume-up-fill" id="soundIcon" aria-hidden="true"></i> الصوت
                    </button>
                    <div class="sound-selector" id="soundSelector">
                        <label class="sr-only" for="soundSelect">نوع صوت التسبيح</label>
                        <select class="sound-select" id="soundSelect" onchange="changeSound(this.value)">
                            <option value="beep">صفير</option>
                            <option value="click">نقرة</option>
                            <option value="water">ماء</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="sound-toggle" id="vibrationToggle" aria-pressed="true" onclick="toggleVibration()">
                    <i class="bi bi-phone-vibrate" aria-hidden="true"></i> الاهتزاز
                </button>
            </div>
            </div>

            <button type="button" class="quick-tap-fab" id="quickTapFab" onclick="increment()" aria-label="تسبيح سريع">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                <span>تسبيح</span>
            </button>

            <div class="history">
                <h2 class="history-title">
                    سجل التسبيح
                    <button type="button" class="clear-all-btn" id="clearHistoryBtn" onclick="clearHistory()"
                        style="display: none;">مسح الكل</button>
                </h2>
                <div class="history-list" id="historyList"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
        <app-bottom-nav current="masbaha"></app-bottom-nav>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title" id="modalTitle"></div>
            </div>
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script src="js/common.js"></script>
        <script src="js/page-scripts/masbaha.js"></script>
    <script src="js/native-ui.js"></script>
</body>

</html>
