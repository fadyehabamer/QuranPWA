<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .bookmarks-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        .bookmarks-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .bookmarks-header-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .bookmarks-header-title {
            font-size: 32px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bookmarks-header-desc {
            font-size: 16px;
            color: var(--text-color);
            opacity: 0.7;
        }

        .bookmarks-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .bookmark-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .bookmark-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: var(--primary-color);
            opacity: 0.1;
            border-radius: 0 16px 0 100%;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow);
            border-color: var(--primary-color);
        }

        .bookmark-card:active {
            transform: translateY(-2px);
        }

        .bookmark-surah-name {
            font-size: 24px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bookmark-details {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            color: var(--text-color);
            opacity: 0.8;
        }

        .bookmark-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
        }

        .bookmark-timestamp {
            font-size: 13px;
            color: var(--text-color);
            opacity: 0.6;
            margin-bottom: 12px;
        }

        .bookmark-actions {
            display: flex;
            gap: 8px;
        }

        .bookmark-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bookmark-btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .bookmark-btn-primary:hover {
            opacity: 0.9;
        }

        .bookmark-btn-delete {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            flex: 0 0 auto;
            padding: 10px 16px;
        }

        .bookmark-btn-delete:hover {
            background: rgba(244, 67, 54, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 24px;
            opacity: 0.3;
        }

        .empty-state-title {
            font-size: 24px;
            color: var(--text-color);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .empty-state-desc {
            font-size: 16px;
            color: var(--text-color);
            opacity: 0.6;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .empty-state-btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--primary-color);
            color: white;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s;
        }

        .empty-state-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .bookmarks-stats {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.7;
        }
    </style>
</head>

        function renderBookmarks() {
            const bookmarks = JSON.parse(localStorage.getItem('quranBookmarks') || '[]');
            const content = document.getElementById('bookmarksContent');
            const stats = document.getElementById('bookmarksStats');
            
            if (bookmarks.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-bookmark" style="font-size: 80px;"></i></div>
                        <h3 class="empty-state-title">لا توجد مواضع محفوظة</h3>
                        <p class="empty-state-desc">لم تقم بحفظ أي موضع بعد.<br>اذهب إلى أي سورة واضغط على "حفظ الموضع" لحفظ مكان قراءتك.</p>
                        <a href="/quran" class="empty-state-btn"><i class="bi bi-book-fill"></i> ابدأ القراءة</a>
                    </div>
                `;
                stats.style.display = 'none';
                return;
            }

            // Show stats
            stats.style.display = 'flex';
            document.getElementById('totalBookmarks').textContent = bookmarks.length;
            const uniqueSurahs = new Set(bookmarks.map(b => b.surah));
            document.getElementById('totalSurahs').textContent = uniqueSurahs.size;

            // Render bookmarks
            const html = `
                <div class="bookmarks-list">
                    ${bookmarks.map((bookmark, index) => {
                        const surah = surahInfo[bookmark.surah - 1];
                        const date = new Date(bookmark.timestamp);
                        const timeAgo = formatTimeAgo(date);
                        
                        return `
                            <div class="bookmark-card">
                                <div class="bookmark-surah-name">${surah.name}</div>
                                <div class="bookmark-details">
                                    <div class="bookmark-detail-item">
                                        <span>📄</span>
                                        <span>صفحة ${bookmark.page + 1}</span>
                                    </div>
                                    <div class="bookmark-detail-item">
                                        <span>•</span>
                                        <span>${surah.type}</span>
                                    </div>
                                </div>
                                <div class="bookmark-timestamp"> ${timeAgo}</div>
                                <div class="bookmark-actions">
                                    <button class="bookmark-btn bookmark-btn-primary" onclick="loadBookmark(${index})">
                                        <i class="bi bi-book-fill"></i> متابعة القراءة
                                    </button>
                                    <button class="bookmark-btn bookmark-btn-delete" onclick="deleteBookmark(${index})">
                                        <i class="bi bi-trash-fill"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            
            content.innerHTML = html;
        }

        function formatTimeAgo(date) {
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (days > 0) return `منذ ${days} ${days === 1 ? 'يوم' : 'أيام'}`;
            if (hours > 0) return `منذ ${hours} ${hours === 1 ? 'ساعة' : 'ساعات'}`;
            if (minutes > 0) return `منذ ${minutes} ${minutes === 1 ? 'دقيقة' : 'دقائق'}`;
            return 'الآن';
        }

        function loadBookmark(index) {
            const bookmarks = JSON.parse(localStorage.getItem('quranBookmarks') || '[]');
            if (!bookmarks[index]) return;
            
            const bookmark = bookmarks[index];
            window.location.href = `/quran?surah=${bookmark.surah}&page=${bookmark.page}`;
        }

        function deleteBookmark(index) {
            showModal({
                type: 'warning',
                icon: '',
                title: 'حذف الموضع',
                message: 'هل أنت متأكد من حذف هذا الموضع المحفوظ؟',
                confirmText: 'نعم، احذف',
                cancelText: 'إلغاء',
                onConfirm: () => {
                    const bookmarks = JSON.parse(localStorage.getItem('quranBookmarks') || '[]');
                    bookmarks.splice(index, 1);
                    localStorage.setItem('quranBookmarks', JSON.stringify(bookmarks));
                    renderBookmarks();
                    showModal({
                        type: 'success',
                        icon: '',
                        title: 'تم الحذف',
                        message: 'تم حذف الموضع المحفوظ بنجاح'
                    });
                }
            });
        }

        let currentModalConfirm = null;

        function showModal({ type = 'info', icon = '', title = '', message = '', confirmText = 'حسناً', cancelText = '', onConfirm = null }) {
            const modal = document.getElementById('customModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalActions = document.getElementById('modalActions');

            modalIcon.textContent = icon;
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            currentModalConfirm = onConfirm;

            let actionsHTML = '';
            if (cancelText && onConfirm) {
                actionsHTML = `
                    <button class="modal-btn modal-btn-secondary" onclick="hideModal()">${cancelText}</button>
                    <button class="modal-btn modal-btn-primary" onclick="confirmModalAction()">${confirmText}</button>
                `;
            } else {
                actionsHTML = `<button class="modal-btn modal-btn-primary" onclick="hideModal()">${confirmText}</button>`;
            }
            modalActions.innerHTML = actionsHTML;

            modal.classList.add('active');
        }

        function confirmModalAction() {
            hideModal();
            if (currentModalConfirm) {
                currentModalConfirm();
                currentModalConfirm = null;
            }
        }

        function hideModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // Load theme settings
        function loadThemeSettings() {
            const darkMode = localStorage.getItem('darkMode') === 'true';
            if (darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
            
            const color = localStorage.getItem('primaryColor');
            if (color) {
                const lightColor = adjustColor(color, 30);
                document.documentElement.style.setProperty('--primary-color', color);
                document.documentElement.style.setProperty('--primary-light', lightColor);
                
                // Update shadow colors
                const rgb = hexToRgb(color);
                const shadowLight = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${darkMode ? 0.25 : 0.15})`;
                const shadowHeavy = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${darkMode ? 0.45 : 0.35})`;
                document.documentElement.style.setProperty('--shadow', shadowLight);
                document.documentElement.style.setProperty('--shadow-heavy', shadowHeavy);
            }
            
            const fontSize = localStorage.getItem('fontSize');
            if (fontSize !== null) {
                const fontSizes = [12, 14, 16, 18, 20, 24, 28];
                const baseSize = fontSizes[parseInt(fontSize)] || 16;
                document.documentElement.style.setProperty('--font-size-base', baseSize + 'px');
            }
            
            const fontWeight = localStorage.getItem('fontWeight');
            if (fontWeight) {
                const fontWeights = [300, 400, 500, 600, 700];
                const weight = fontWeights[parseInt(fontWeight)];
                document.documentElement.style.setProperty('--font-weight', weight);
            }
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 27, g: 94, b: 32 };
        }

        function adjustColor(color, amount) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * amount);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255))
                .toString(16).slice(1);
        }

        loadThemeSettings();
        renderBookmarks();

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed'));
        }
    </script>
