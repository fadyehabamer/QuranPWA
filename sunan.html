<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>سنن النبي ﷺ</title>
    <meta name="description" content="السنن النبوية اليومية مصنفة حسب الموضوع.">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="data/manifest.json">
    <meta name="theme-color" content="#fbf8f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="القرآن الكريم">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Lateef&family=Reem+Kufi:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="js/theme-preload.js"></script>
    <script src="js/a11y.js"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/page-styles/sunan.css">
    <link rel="stylesheet" href="css/app-ui.css">
    <link rel="stylesheet" href="css/tour.css">
    <link rel="stylesheet" href="css/native.css">
    <link rel="stylesheet" href="css/nav.css">
</head>

<body>
    <!-- Sidebar Overlay -->
    <!-- Desktop Sidebar -->
        <app-sidebar current="sunan"></app-sidebar>

    <app-header title="سنن النبي ﷺ" heading-id="headerTitle">
        <button class="header-back-btn" id="backBtn" onclick="showCategories()" style="display: none;"
            aria-label="رجوع للأقسام">
            <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
        <div class="visitor-badge">
            <i class="bi bi-people-fill" aria-hidden="true"></i>
            <span class="count" id="visitorCount">-</span>
        </div>
    </app-header>

    <main class="app-content">
        <div class="sunan-container">
            <!-- Categories Grid. Real <button>s, not clickable <div>s: they are
                 now in the tab order and activate with Enter/Space. -->
            <div class="category-grid" id="categoryGrid">
                <button type="button" class="category-card" onclick="showSunan('waking_up')">
                    <span class="category-icon"><i class="bi bi-sun" aria-hidden="true"></i></span>
                    <span class="category-title">سنن الاستيقاظ</span>
                </button>
                <button type="button" class="category-card" onclick="showSunan('ablution')">
                    <span class="category-icon"><i class="bi bi-droplet" aria-hidden="true"></i></span>
                    <span class="category-title">سنن الوضوء</span>
                </button>
                <button type="button" class="category-card" onclick="showSunan('prayer')">
                    <span class="category-icon"><i class="bi bi-person" aria-hidden="true"></i></span>
                    <span class="category-title">سنن الصلاة</span>
                </button>
                <button type="button" class="category-card" onclick="showSunan('eating')">
                    <span class="category-icon"><i class="bi bi-cup-hot" aria-hidden="true"></i></span>
                    <span class="category-title">سنن الطعام</span>
                </button>
                <button type="button" class="category-card" onclick="showSunan('sleeping')">
                    <span class="category-icon"><i class="bi bi-moon-stars" aria-hidden="true"></i></span>
                    <span class="category-title">سنن النوم</span>
                </button>
                <button type="button" class="category-card" onclick="showSunan('general')">
                    <span class="category-icon"><i class="bi bi-stars" aria-hidden="true"></i></span>
                    <span class="category-title">سنن عامة</span>
                </button>
            </div>

            <!-- Sunan List -->
            <div class="sunan-list" id="sunanList"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
        <app-bottom-nav current="sunan"></app-bottom-nav>

    <script src="js/notify-store.js"></script>
    <script src="js/common.js"></script>
        <script src="js/page-scripts/sunan.js"></script>
    <script src="js/native-ui.js"></script>
    <script src="js/tour.js"></script>
    <script src="js/tours.js"></script>
    <script src="js/notifications.js"></script>
</body>

</html>
