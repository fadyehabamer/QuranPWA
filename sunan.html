<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنن النبي ﷺ</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1B5E20">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .sunan-container {
            padding: 20px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px var(--shadow-heavy);
            border-color: var(--primary-color);
        }

        .category-icon {
            font-size: 32px;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .category-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .sunan-list {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .sunan-list.active {
            display: flex;
        }

        .sunnah-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 4px var(--shadow);
            transition: all 0.2s;
        }

        .sunnah-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow);
        }

        .sunnah-text {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .sunnah-source {
            font-size: 14px;
            color: var(--primary-color);
            opacity: 0.8;
            font-weight: 600;
        }

        .header-back-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Desktop Sidebar -->
    <aside class="desktop-sidebar" id="sidebar">
        <div class="sidebar-logo">
            <button class="sidebar-close-btn" onclick="toggleSidebar()">×</button>
            <div class="sidebar-logo-text">القرآن الكريم</div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="sidebar-nav-item">
                <div class="sidebar-nav-label">الرئيسية</div>
            </a>
            <a href="quran" class="sidebar-nav-item">
                <div class="sidebar-nav-label">القرآن الكريم</div>
            </a>
            <a href="bookmarks" class="sidebar-nav-item">
                <div class="sidebar-nav-label">المواضع المحفوظة</div>
            </a>
            <a href="azkar" class="sidebar-nav-item">
                <div class="sidebar-nav-label">الأذكار</div>
            </a>
            <a href="masbaha" class="sidebar-nav-item">
                <div class="sidebar-nav-label">المسبحة</div>
            </a>
            <a href="sunan" class="sidebar-nav-item active">
                <div class="sidebar-nav-label">سنن النبي</div>
            </a>
            <a href="prayer-times" class="sidebar-nav-item">
                <div class="sidebar-nav-label">مواقيت الصلاة</div>
            </a>
            <a href="/bio" class="sidebar-nav-item">
                <div class="sidebar-nav-label">عن المطور</div>
            </a>
            <a href="settings" class="sidebar-nav-item">
                <div class="sidebar-nav-label">الإعدادات</div>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-version">الإصدار 1.0.0</div>
        </div>
    </aside>

    <header class="app-header">
        <button class="menu-toggle-btn" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>
        <h1 id="headerTitle">سنن النبي ﷺ</h1>
        <div class="header-left-buttons">
            <div class="visitor-badge">
                <i class="bi bi-people-fill"></i>
                <span class="count" id="visitorCount">-</span>
            </div>
            <button class="icon-btn" id="backBtn" onclick="showCategories()" style="display: none;">
                <i class="bi bi-arrow-right"></i>
            </button>
            <button class="settings-btn" onclick="window.location.href='settings'">
                <i class="bi bi-gear-fill"></i>
            </button>
        </div>
    </header>

    <main class="app-content">
        <div class="sunan-container">
            <!-- Categories Grid -->
            <div class="category-grid" id="categoryGrid">
                <div class="category-card" onclick="showSunan('waking_up')">
                    <div class="category-icon"><i class="bi bi-sun"></i></div>
                    <div class="category-title">سنن الاستيقاظ</div>
                </div>
                <div class="category-card" onclick="showSunan('ablution')">
                    <div class="category-icon"><i class="bi bi-droplet"></i></div>
                    <div class="category-title">سنن الوضوء</div>
                </div>
                <div class="category-card" onclick="showSunan('prayer')">
                    <div class="category-icon"><i class="bi bi-person-praying"></i></div>
                    <div class="category-title">سنن الصلاة</div>
                </div>
                <div class="category-card" onclick="showSunan('eating')">
                    <div class="category-icon"><i class="bi bi-cup-hot"></i></div>
                    <div class="category-title">سنن الطعام</div>
                </div>
                <div class="category-card" onclick="showSunan('sleeping')">
                    <div class="category-icon"><i class="bi bi-moon-stars"></i></div>
                    <div class="category-title">سنن النوم</div>
                </div>
                <div class="category-card" onclick="showSunan('general')">
                    <div class="category-icon"><i class="bi bi-stars"></i></div>
                    <div class="category-title">سنن عامة</div>
                </div>
            </div>

            <!-- Sunan List -->
            <div class="sunan-list" id="sunanList"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <i class="bi bi-house-door"></i>
            <span class="nav-label">الرئيسية</span>
        </a>
        <a href="quran" class="nav-item">
            <i class="bi bi-book"></i>
            <span class="nav-label">القرآن</span>
        </a>
        <a href="azkar" class="nav-item">
            <i class="bi bi-moon-stars"></i>
            <span class="nav-label">الأذكار</span>
        </a>
        <a href="masbaha" class="nav-item">
            <i class="bi bi-circle"></i>
            <span class="nav-label">المسبحة</span>
        </a>
        <a href="sunan" class="nav-item active">
            <i class="bi bi-sun"></i>
            <span class="nav-label">السنن</span>
        </a>
        <a href="settings" class="nav-item">
            <i class="bi bi-gear"></i>
            <span class="nav-label">الإعدادات</span>
        </a>
    </nav>

    <script src="common.js"></script>
    <script>
        const sunanData = {
            'waking_up': {
                title: 'سنن الاستيقاظ',
                items: [
                    { text: 'مسح أثر النوم عن الوجه باليد.', source: 'رواه البخاري ومسلم' },
                    { text: 'الدعاء: "الحمد لله الذي أحيانا بعدما أماتنا وإليه النشور".', source: 'رواه البخاري' },
                    { text: 'السواك.', source: 'رواه البخاري ومسلم' },
                    { text: 'غسل اليدين ثلاثاً.', source: 'رواه البخاري ومسلم' }
                ]
            },
            'ablution': {
                title: 'سنن الوضوء',
                items: [
                    { text: 'التسمية في أوله.', source: 'رواه أبو داود' },
                    { text: 'غسل الكفين ثلاثاً في أوله.', source: 'رواه البخاري ومسلم' },
                    { text: 'المضمضة والاستنشاق باليد اليمنى.', source: 'رواه البخاري ومسلم' },
                    { text: 'المبالغة في المضمضة والاستنشاق لغير الصائم.', source: 'رواه الأربعة' },
                    { text: 'السواك.', source: 'رواه أحمد' },
                    { text: 'تخليل اللحية الكثيفة.', source: 'رواه الترمذي' },
                    { text: 'مسح الأذنين.', source: 'رواه ابن ماجه' },
                    { text: 'التيامن (البدء باليمين).', source: 'رواه البخاري ومسلم' },
                    { text: 'الدعاء بعد الوضوء: "أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمداً عبده ورسوله".', source: 'رواه مسلم' },
                    { text: 'صلاة ركعتين بعد الوضوء.', source: 'رواه البخاري ومسلم' }
                ]
            },
            'prayer': {
                title: 'سنن الصلاة',
                items: [
                    { text: 'رفع اليدين عند تكبيرة الإحرام.', source: 'رواه البخاري ومسلم' },
                    { text: 'وضع اليد اليمنى على اليسرى على الصدر.', source: 'رواه البخاري' },
                    { text: 'دعاء الاستفتاح.', source: 'رواه البخاري ومسلم' },
                    { text: 'الاستعاذة والبسملة.', source: 'رواه مسلم' },
                    { text: 'التأمين (قول آمين) بعد الفاتحة.', source: 'رواه البخاري ومسلم' },
                    { text: 'قراءة سورة بعد الفاتحة في الركعتين الأوليين.', source: 'رواه البخاري ومسلم' },
                    { text: 'الجهر بالقراءة في صلاة الفجر والمغرب والعشاء.', source: 'رواه البخاري ومسلم' },
                    { text: 'التكبير عند الانتقال.', source: 'رواه البخاري ومسلم' },
                    { text: 'قول "سمع الله لمن حمده" عند الرفع من الركوع.', source: 'رواه البخاري ومسلم' },
                    { text: 'قول "ربنا ولك الحمد" بعد الرفع من الركوع.', source: 'رواه البخاري ومسلم' },
                    { text: 'التسبيح في الركوع والسجود.', source: 'رواه مسلم' },
                    { text: 'الدعاء بين السجدتين.', source: 'رواه أبو داود' },
                    { text: 'الجلوس للتشهد الأول.', source: 'رواه البخاري' },
                    { text: 'الصلاة على النبي ﷺ في التشهد الأخير.', source: 'رواه البخاري ومسلم' },
                    { text: 'الدعاء بعد التشهد الأخير وقبل التسليم.', source: 'رواه البخاري ومسلم' },
                    { text: 'التسليمة الثانية.', source: 'رواه مسلم' }
                ]
            },
            'eating': {
                title: 'سنن الطعام',
                items: [
                    { text: 'التسمية (قول بسم الله) في أوله.', source: 'رواه البخاري ومسلم' },
                    { text: 'الأكل باليمين.', source: 'رواه مسلم' },
                    { text: 'الأكل مما يليك.', source: 'رواه البخاري ومسلم' },
                    { text: 'لعق الأصابع بعد الأكل.', source: 'رواه مسلم' },
                    { text: 'سلت القصعة (مسح الطبق).', source: 'رواه مسلم' },
                    { text: 'حمد الله بعد الأكل.', source: 'رواه البخاري' },
                    { text: 'المضمضة بعد شرب اللبن.', source: 'رواه البخاري ومسلم' }
                ]
            },
            'sleeping': {
                title: 'سنن النوم',
                items: [
                    { text: 'النوم على وضوء.', source: 'رواه البخاري ومسلم' },
                    { text: 'نفض الفراش.', source: 'رواه البخاري ومسلم' },
                    { text: 'النوم على الشق الأيمن.', source: 'رواه البخاري ومسلم' },
                    { text: 'وضع اليد اليمنى تحت الخد الأيمن.', source: 'رواه البخاري' },
                    { text: 'قراءة آية الكرسي.', source: 'رواه البخاري' },
                    { text: 'قراءة المعوذتين (الفلق والناس).', source: 'رواه البخاري ومسلم' },
                    { text: 'الدعاء: "باسمك اللهم أموت وأحيا".', source: 'رواه البخاري' }
                ]
            },
            'general': {
                title: 'سنن عامة',
                items: [
                    { text: 'السواك عند كل صلاة وعند دخول البيت.', source: 'رواه البخاري ومسلم' },
                    { text: 'البدء باليمين عند لبس النعل والترجل والطهور.', source: 'رواه البخاري ومسلم' },
                    { text: 'إفشاء السلام.', source: 'رواه مسلم' },
                    { text: 'تشميت العاطس.', source: 'رواه البخاري' },
                    { text: 'عيادة المريض.', source: 'رواه البخاري' },
                    { text: 'اتباع الجنائز.', source: 'رواه البخاري' },
                    { text: 'إجابة الدعوة.', source: 'رواه البخاري ومسلم' },
                    { text: 'نصر المظلوم.', source: 'رواه البخاري' }
                ]
            }
        };

        function showSunan(categoryKey) {
            const category = sunanData[categoryKey];
            const list = document.getElementById('sunanList');
            let html = '';

            category.items.forEach(item => {
                html += `
                    <div class="sunnah-item">
                        <div class="sunnah-text">${item.text}</div>
                        <div class="sunnah-source">${item.source}</div>
                    </div>
                `;
            });

            list.innerHTML = html;
            document.getElementById('categoryGrid').style.display = 'none';
            list.classList.add('active');
            document.getElementById('headerTitle').textContent = category.title;
            document.getElementById('backBtn').style.display = 'block';
        }

        function showCategories() {
            document.getElementById('sunanList').classList.remove('active');
            document.getElementById('categoryGrid').style.display = 'grid';
            document.getElementById('headerTitle').textContent = 'سنن النبي ﷺ';
            document.getElementById('backBtn').style.display = 'none';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // Load theme settings
        (function () {
            const darkMode = localStorage.getItem('darkMode') === 'true';
            if (darkMode) document.documentElement.setAttribute('data-theme', 'dark');

            const color = localStorage.getItem('primaryColor');
            if (color) {
                const num = parseInt(color.replace('#', ''), 16);
                const amt = Math.round(2.55 * 30);
                const R = (num >> 16) + amt;
                const G = (num >> 8 & 0x00FF) + amt;
                const B = (num & 0x0000FF) + amt;
                const lightColor = '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 + (G < 255 ? G < 1 ? 0 : G :
                    255) * 0x100 + (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
                document.documentElement.style.setProperty('--primary-color', color);
                document.documentElement.style.setProperty('--primary-light', lightColor);
            }
        })();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
